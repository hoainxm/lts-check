name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend ↔ Code.gs đủ action
        run: node scripts/check-actions.mjs
      - name: Test backend (giờ VN, giống appsscript.json)
        run: TZ=Asia/Ho_Chi_Minh node --test tests/backend.test.cjs
